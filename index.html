<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <div class="card">
      <div class="header">
        <span class="badge">1 to 10</span>
        <h1>Number Guessing Game</h1>
        <p class="subtitle">Can you guess the secret number between <strong>1</strong> and <strong>10</strong>?</p>
      </div>

      <div class="game-body">
        <!-- Input area -->
        <div class="input-group">
          <input 
            type="number" 
            id="user-guess" 
            placeholder="Enter a number (1-10)" 
            min="1" 
            max="10" 
            autocomplete="off"
          >
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
          <button id="guess-btn" class="btn btn-primary">Guess</button>
          <button id="play-again-btn" class="btn btn-restart hidden">Play Again</button>
        </div>

        <!-- Status Message & Attempts -->
        <div class="feedback-area">
          <p id="message" class="message">Enter your guess and click Guess!</p>
          <div class="stats">
            <span class="attempts-label">Attempts:</span>
            <span id="attempts-count" class="attempts-badge">0</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
